spring:
  application:
    name: kitabxana-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/kitabxana
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jooq:
    sql-dialect: postgres

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    az.caspiantech.kitabxanademo: DEBUG
    org.jooq.tools.LoggerListener: DEBUG
  file:
    name: logs/application-log.txt
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

    springdoc:
      swagger-ui:
        path: /swagger-ui.html
      api-docs:
        path: /v3/api-docs


# Kitabın səhifələrini gətirən bir endpoint olmalıdı

# 2 endpoint lazimdi kitabı da açsın içində də onun bütün sehifeleri. İkinci endpoint a kitsbin b səhifəsini gətir